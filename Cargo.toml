[package]
name = "parse_pdms_db"
version = "1.0.0"
edition = "2021"


[features]
default = ["compression"] #"compression"
compression = []
web = []                  #compile for just web usage, now it is too heavy now

[dependencies]
memchr = "2.6.3"
nom = "7.1.1"
#nom-derive = "0.10.0"
itertools = "0.11.0"
bincode = "1.3.3"
#glam = { version = "0.20.2", features = ["transform-types"] }
fasteval = "0.2.4"
regex = "1.5.4"
futures = "0.3.19"
async-trait = "0.1.52"
approx = "0.5.1"
bitflags = "2.4.0"
derivative = "2.2.0"
concurrent-queue = "1.2.2"
instant = "0.1.12"
pollster = "0.3.0"
ordered-float = "2.10.0"
config = "0.13.1"


highway = "0.7.0"
hash32 = "0.3.1"
hash32-derive = "0.1.1"

serde-name = "0.2.1"
serde = { version = "1.0.137", features = ["derive"] }
serde_derive = "1.0.137"
phf = { version = "0.10.1", features = ["macros"] }
clap = { version = "4.3.5", features = ["derive"] }
log = "0.4.14"
simplelog = "0.10.0"
rayon = "1.5.2"
tokio = { version = "1.18.2", features = ["full"] }
serde_json = { version = "1.0" }
lazy_static = "1.4.0"
cached = { version = "0.26.2", default-features = false, features = [
    "proc_macro",
] }
dashmap = { version = "5.5.3", features = ["serde"] }
hex = "0.4.3"
flate2 = "1.0.24"

calamine = "0.18.0"

id_tree = { version = "1.8.0", features = ["serde_support"] }
smol_str = { version = "0.2.0", features = ["serde"] }
#rand = "*"
anyhow = "1.0"
env_logger = "*"
thiserror = "*"


aios_core = { path = "../crates/aios-core" }

truck-base = { version = "0.4.0", path = "../crates/truck/truck-base" }
truck-geotrait = { version = "0.3.0", path = "../crates/truck/truck-geotrait" }
truck-geometry = { version = "0.4.0", path = "../crates/truck/truck-geometry" }
truck-polymesh = { version = "0.5.0", path = "../crates/truck/truck-polymesh" }
truck-topology = { version = "0.5.0", path = "../crates/truck/truck-topology" }
truck-modeling = { version = "0.5.1", path = "../crates/truck/truck-modeling" }
truck-meshalgo = { version = "0.3.0", path = "../crates/truck/truck-meshalgo" }
#truck-stepio = { version = "0.2.0", path = "../crates/truck/truck-stepio" }


once_cell = "1.9.0"
dynfmt = { version = "0.1.5", features = ["curly", "python"] }
