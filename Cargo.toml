[package]
name = "parse_pdms_db"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
#nom = "7.0.0"
memchr = "2.4.1"
slab_tree = "0.3.2"
itertools = "0.10.1"
bincode = "1.3.3"
nalgebra = "0.26.2"
nalgebra-glm = "0.12.0"
prost = "0.8"
tonic = "0.5.0"
glam = "0.15.2"
fasteval = "0.2.4"
regex = "1.5.4"

nom = "6.1.2"
nom-derive = "0.9.0"

serde-name = "0.1.1"
serde = { version = "1.0.126", features = ["derive"] }
phf = { version = "0.9", features = ["macros"] }
clap = "2.33.3"
mongodb = { version = "2.0.1", default-features = false, features = ["async-std-runtime"] }
log = "0.4.14"
simplelog = "0.10.0"
rayon = "1.5.1"
dashmap = { version="4.0.2" , features=["serde"] }
tokio = { version = "1.11.0", features = ["full"] }
#mysql = "21.0.2"
serde_json = { version = "1.0" }
lazy_static = "1.4.0"

static_init = "1.0.1"